<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">QuickBid Backend Architecture</title><desc id="svg-desc">Mobile application communicates through REST and WebSocket STOMP with a Spring Boot application. Core services store data in PostgreSQL via JPA and JDBC with Flyway migrations, use local file storage and optional mail provider delivery.</desc>
